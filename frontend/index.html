<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Narrato</title>
    <!-- Google Fonts: Montserrat (ui) and Merriweather (subtitles/documents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!--
      Eel Script Bridge - Loaded synchronously to ensure it's available before React loads.
      In development, this is proxied from the Python backend (port 8888).
      In production, this is served from the bundled assets.

      FIX: Loading synchronously prevents race condition where React initializes
      before eel.js is available. The eel-bridge.ts module will handle reconnection
      if the WebSocket backend isn't ready yet.
    -->
    <script>document.write('<script type="text/javascript" src="/eel.js"><\/script>');</script>

    <!--
      Pre-register exposed functions to avoid "function not found" errors
      when Python tries to call these before React listeners are registered.
    -->
    <script type="text/javascript">
      // Stub listeners that will be replaced by real ones in eelListeners.ts
      if (window.eel) {
        window.eel.expose(function(msg) {}, "on_log_stream");
        window.eel.expose(function(data) {}, "on_progress_update");
        window.eel.expose(function(data) {}, "on_kokoro_download_progress");
        window.eel.expose(function(data) {}, "on_whisper_download_progress");
        window.eel.expose(function(data) {}, "on_ytdlp_update_progress");
      }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
