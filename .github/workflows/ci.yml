name: CI (Build & Test)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Pytest Suite & Verify Frontend Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite App & Remotion Composition
        working-directory: frontend
        run: |
          npm run build
          npm run build:remotion

      - name: Install Python Dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install pytest pytest-asyncio typeguard

      - name: Initialize SQLite Schema
        run: |
          python -c "from backend.database.db import init_db; init_db()"

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short
